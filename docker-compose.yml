version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: veritix-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - veritix-network

  # Optional: local API mock for development
  mock-api:
    image: stoplight/prism:4
    container_name: veritix-mock-api
    command: mock -h 0.0.0.0 /tmp/openapi.yml
    volumes:
      - ./docs/openapi.yml:/tmp/openapi.yml:ro
    ports:
      - "4010:4010"
    networks:
      - veritix-network
    profiles:
      - mock

networks:
  veritix-network:
    driver: bridge

volumes:
  node_modules: