services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: veritix-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # Default matches the one in src/lib/env.ts; keep the two in step.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    # Optional. To override the defaults above, copy the template first:
    #   cp .env.example .env.local
    # `required: false` needs Docker Compose 2.24 or newer; without the file
    # the container starts with the defaults in `environment`.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
    networks:
      - veritix-network

  # Optional: local API mock for development
  mock-api:
    image: stoplight/prism:4
    container_name: veritix-mock-api
    command: mock -h 0.0.0.0 /tmp/openapi.yml
    volumes:
      - ./docs/openapi.yml:/tmp/openapi.yml:ro
    ports:
      - "4010:4010"
    networks:
      - veritix-network
    profiles:
      - mock

networks:
  veritix-network:
    driver: bridge

volumes:
  node_modules: